version: '3.8'

# ============================================================
# Docker Compose untuk menjalankan Jenkins secara lokal
# Gunakan ini hanya untuk development/testing
#
# Cara menjalankan:
#   docker-compose -f docker-compose.jenkins.yml up -d
#
# Akses Jenkins di: http://localhost:8080
# ============================================================

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: jenkins-wms
    restart: unless-stopped
    ports:
      - "9090:8080"       # Jenkins UI (akses via http://localhost:9090)
      - "50000:50000"     # Jenkins agent port
    volumes:
      # Simpan data Jenkins secara persisten
      - jenkins_home:/var/jenkins_home
      # Mounting Docker socket agar Jenkins bisa jalankan Docker
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    networks:
      - jenkins-net

volumes:
  jenkins_home:
    driver: local

networks:
  jenkins-net:
    driver: bridge
